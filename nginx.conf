# =====================================================================
# 生产环境 Nginx 配置
# ---------------------------------------------------------------------
# 【核心：两条规则必须和 frontend/vite.config.ts 里的 dev proxy 完全一致】
#
#   开发时（vite.config.ts）：
#     /api -> http://127.0.0.1:8003  且 去掉 /api 前缀
#     /kb  -> http://127.0.0.1:8010   且 保留 /kb 前缀
#
#   生产时（本文件）：
#     /api/ -> 显式 rewrite 去掉 /api 前缀
#     /kb/  -> 原样透传，保留 /kb 前缀
#
#   搞反的后果：
#     /api 写错 -> 前端全部 404（后端真实路径是 /student/xxx）
#     /kb  写错 -> 小助手 404（后端真实路径本来就是 /kb/chat）
#
# =====================================================================
#
# 【为什么用变量形式 + 显式 rewrite】（实测踩过两个坑）
# ---------------------------------------------------------------------
# 坑 1：直接写 proxy_pass http://backend:8003/;
#   Nginx 在【启动时】就把 "backend" 解析成 IP 并固化。
#   容器刚起来时 Docker 内嵌 DNS 还没写好这条记录，Nginx 直接退出：
#       [emerg] host not found in upstream "backend"
#   而且 restart: unless-stopped 救不回来 —— 它会一直重启。
#   depends_on 只保证启动【顺序】，不保证 DNS 记录已生成。
#
#   => 解法：写成变量 $backend_upstream，配合 resolver 延迟到请求时才解析。
#
# 坑 2：变量形式下 proxy_pass 【不做 URI 前缀替换】
#   这个非常隐蔽。写
#       proxy_pass http://$backend_upstream:8003/;
#   看着像静态写法那样"末尾斜杠 = 去掉 /api 前缀"，
#   但实际上请求会被转成 GET / —— 前缀和路径全丢了。
#   后端日志里能直接看到：
#       INFO: 172.18.0.5 - "GET / HTTP/1.1" 404 Not Found
#
#   => 解法：路径处理用【显式 rewrite】，proxy_pass 不带 URI 部分。
#      语义就完全确定了，不依赖 proxy_pass 的隐式替换规则。
#
# 【实测验证】改成下面这样之后，后端日志收到的是正确的路径：
#     GET /student/select_stu_skip?skip=0&limit=3   200 OK
#     GET /reset/status                              200 OK
# =====================================================================

server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS，延迟解析（否则启动时 host not found in upstream）
    # 【注意】resolver 和 set 都必须写在 server / location 块【内部】，
    # 写在 server 外面会报 "set directive is not allowed here"。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend;
    set $kb_upstream kb;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩：静态资源小一点，网络传输快一点
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_vary on;

    # ---------------------------------------------------------------
    # 前端静态资源
    # ---------------------------------------------------------------
    location / {
        # SPA history 路由兜底。
        # 少了这行，直接访问 /student 或刷新页面会 404 —— Vue Router 用的是 history 模式。
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # 主后端 API
    # ---------------------------------------------------------------
    location /api/ {
        # 显式去掉 /api 前缀：/api/student/xxx -> /student/xxx
        # 写成 rewrite 而不是依赖 proxy_pass 的隐式替换 —— 原因见文件头说明
        rewrite ^/api/(.*)$ /$1 break;

        # 【不带】URI 部分，配合上面的 rewrite，路径不会被二次处理
        proxy_pass http://$backend_upstream:8003;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # 知识库小助手
    # ---------------------------------------------------------------
    location /kb/ {
        # 【不 rewrite】保留 /kb 前缀 —— 后端路由本来就是 /kb/chat
        proxy_pass http://$kb_upstream:8010;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 小助手是 SSE 流式返回。
        # 缓冲不开的话，模型生成的回答会一直卡着不出来（要等缓冲满了才吐），
        # 表现为「小助手一直转圈」。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # 大模型响应慢，超时给足
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
